name: Rename package
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace app.aemu everywhere
        run: |
          set -e
          grep -rl "app\.aemu" app/src app/build.gradle.kts | while read -r f; do
            sed -i 's/app\.aemu/com.haseeb.emulator/g' "$f"
          done
          echo "--- remaining old names ---"
          grep -rn "app\.aemu" app/src app/build.gradle.kts || echo "none"
          git config user.name "rename-bot"
          git config user.email "rename-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to change"; else
            git commit -m "rename package to com.haseeb.emulator"
            git push
          fi
