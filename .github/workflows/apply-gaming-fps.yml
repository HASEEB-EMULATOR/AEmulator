name: Gaming fps and all devices
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply
        run: |
          python3 - <<'PY'
          import base64

          CORE = "app/src/main/java/app/aemu/core/"
          UI = "app/src/main/java/app/aemu/ui/"
          VM = UI + "VmActivity.kt"
          ASA = UI + "AppSettingsActivity.kt"

          open(CORE + "Gaming.kt", "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          open(UI + "GamingDialog.kt", "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          print("wrote Gaming.kt + GamingDialog.kt (fps + all-device safe)")

          def sub(path, old, new, tag):
              s = open(path, encoding="utf-8").read()
              if tag in s:
                  print("  already:", tag); return
              if old not in s:
                  print("  OLD NOT FOUND in", path); return
              s = s.replace(old, new, 1)
              open(path, "w", encoding="utf-8").write(s)
              print("  patched:", tag)

          OLD_VM = """            onPick = { d ->
                          gamingDialog = false
                          app.aemu.core.Gaming.apply(this@VmActivity, vm.img.id, d)
                          hideSystemBars()
                          toast("Gaming mode: " + d.label + " - restart the system")
                      },"""
          NEW_VM = """            onPick = { d, fps ->
                          gamingDialog = false
                          app.aemu.core.Gaming.apply(this@VmActivity, vm.img.id, d, fps)
                          hideSystemBars()
                          toast("Gaming mode: " + d.label + " @ " + fps + " fps - restart the system")
                      },"""
          sub(VM, OLD_VM, NEW_VM, "apply(this@VmActivity, vm.img.id, d, fps)")

          OLD_ASA = """        onPick = { d ->
                      gamingDialog = false
                      defaults = app.aemu.core.Gaming.applyDefaults(ctx, defaults, d)
                      AppPrefs.setDefaults(ctx, defaults)
                  },"""
          NEW_ASA = """        onPick = { d, fps ->
                      gamingDialog = false
                      defaults = app.aemu.core.Gaming.applyDefaults(ctx, defaults, d, fps)
                      AppPrefs.setDefaults(ctx, defaults)
                  },"""
          sub(ASA, OLD_ASA, NEW_ASA, "applyDefaults(ctx, defaults, d, fps)")

          PY

      - name: Commit
        run: |
          git config user.name "gaming-bot"
          git config user.email "gaming-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "gaming mode: fps selector, identity-only spoof (works on every gpu)"
            git push
          fi
