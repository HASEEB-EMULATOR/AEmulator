name: Build AEmulator APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          set -e
          SDK=$HOME/android-sdk
          mkdir -p "$SDK/cmdline-tools"
          cd "$SDK"
          curl -sSLo clt.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q clt.zip -d cmdline-tools
          mv cmdline-tools/cmdline-tools cmdline-tools/latest
          yes | cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" --licenses > /dev/null || true
          cmdline-tools/latest/bin/sdkmanager --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
      - name: Prepare build
        run: |
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g|' gradle.properties
          keytool -genkeypair -keystore my-release.jks -alias aemu -keyalg RSA -keysize 2048 -validity 10000 -storepass aemulator -keypass aemulator -dname "CN=HASEEB"
          printf 'storeFile=my-release.jks\nstorePassword=aemulator\nkeyAlias=aemu\nkeyPassword=aemulator\n' > keystore.properties
          chmod +x gradlew
      - name: Build
        run: ./gradlew --no-daemon assembleStandardRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aemulator-apk
          path: app/build/outputs/apk/standard/release/*.apk
