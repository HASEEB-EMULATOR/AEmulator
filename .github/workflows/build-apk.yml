name: Build AEmulator APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare build
        run: |
          sed -i '/^org\.gradle\.java\.home/d' gradle.properties
          sed -i 's|^org\.gradle\.jvmargs=.*|org.gradle.jvmargs=-Xmx4g|' gradle.properties
          keytool -genkeypair -keystore my-release.jks -alias aemu -keyalg RSA -keysize 2048 -validity 10000 -storepass aemulator -keypass aemulator -dname "CN=AEmulator"
          printf 'storeFile=my-release.jks\nstorePassword=aemulator\nkeyAlias=aemu\nkeyPassword=aemulator\n' > keystore.properties
          chmod +x gradlew
      - name: Build
        run: ./gradlew --no-daemon assembleStandardRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aemulator-apk
          path: app/build/outputs/apk/standard/release/*.apk
