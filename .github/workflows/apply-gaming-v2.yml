name: Gaming mode v2
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply
        run: |
          python3 - <<'PY'
          import base64

          CORE = "app/src/main/java/app/aemu/core/"
          UI = "app/src/main/java/app/aemu/ui/"
          GVM = CORE + "GuestVm.kt"
          VM = UI + "VmActivity.kt"
          ASA = UI + "AppSettingsActivity.kt"

          open(CORE + "Gaming.kt", "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          open(UI + "GamingDialog.kt", "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          print("wrote Gaming.kt + GamingDialog.kt")

          ASA_STATE = base64.b64decode("ICAgIHZhciBnYW1pbmdEaWFsb2cgYnkgcmVtZW1iZXIgeyBtdXRhYmxlU3RhdGVPZihmYWxzZSkgfQo=").decode("utf-8")
          ASA_ROW = base64.b64decode("").decode("utf-8")
          ASA_DLG = base64.b64decode("").decode("utf-8")

          def sub(path, old, new, tag):
              s = open(path, encoding="utf-8").read()
              if tag in s:
                  print("  already:", tag); return
              if old not in s:
                  print("  OLD NOT FOUND in", path); return
              s = s.replace(old, new, 1)
              open(path, "w", encoding="utf-8").write(s)
              print("  patched:", tag)

          # GuestVm: guest reports the picked phone
          OLD_GVM = '        if (Gaming.gpuEnabled(ctx)) runCatching { Gaming.gpuProps().forEach { (k, v) -> overrides[k] = v } }\n'
          NEW_GVM = '        // gaming mode: the phone picked in Gaming mode\n        runCatching { Gaming.props(ctx).forEach { (k, v) -> overrides[k] = v } }\n'
          sub(GVM, OLD_GVM, NEW_GVM, "Gaming.props(ctx)")

          # VmActivity: menu entry opens the picker
          OLD_MENU = """                    DropdownMenuItem(text = { Text("Gaming mode") },
                                  onClick = {
                                      menu = false
                                      app.aemu.core.Gaming.apply(this@VmActivity, vm.img.id)
                                      app.aemu.core.Gaming.setGpu(this@VmActivity, true)
                                      hideSystemBars()
                                      toast("Gaming preset saved - restart the system")
                                  })
          """
          NEW_MENU = '                    DropdownMenuItem(text = { Text("Gaming mode") },\n                        onClick = { menu = false; gamingDialog = true })\n'
          sub(VM, OLD_MENU, NEW_MENU, "gamingDialog = true")

          OLD_STATE = '        var spoofDialog by remember { mutableStateOf(false) }\n'
          NEW_STATE = (OLD_STATE +
              '        var gamingDialog by remember { mutableStateOf(false) }\n'
              '        if (gamingDialog) GamingDialog(\n'
              '            onPick = { d ->\n'
              '                gamingDialog = false\n'
              '                app.aemu.core.Gaming.apply(this@VmActivity, vm.img.id, d)\n'
              '                hideSystemBars()\n'
              '                toast("Gaming mode: " + d.label + " - restart the system")\n'
              '            },\n'
              '            onDismiss = { gamingDialog = false }\n'
              '        )\n')
          sub(VM, OLD_STATE, NEW_STATE, "var gamingDialog")

          # Settings screen: state, button in the defaults section, dialog
          sub(ASA, '    var langDialog by remember { mutableStateOf(false) }\n',
                  '    var langDialog by remember { mutableStateOf(false) }\n' + ASA_STATE, "var gamingDialog by remember")

          sub(ASA, '                    fun set(s: app.aemu.core.VmSettings) { defaults = s; AppPrefs.setDefaults(ctx, s) }\n',
                  '                    fun set(s: app.aemu.core.VmSettings) { defaults = s; AppPrefs.setDefaults(ctx, s) }\n' + ASA_ROW,
                  'Gaming mode - pick a phone')

          sub(ASA, '    if (langDialog) {\n', ASA_DLG + '    if (langDialog) {\n', 'if (gamingDialog) GamingDialog')

          PY

      - name: Commit
        run: |
          git config user.name "gaming-bot"
          git config user.email "gaming-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "gaming mode: device picker, screen fit, settings entry"
            git push
          fi
