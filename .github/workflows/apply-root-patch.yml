name: Apply root patch
on: workflow_dispatch
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply the patch
        run: |
          python3 - <<'PY'
          import base64, os

          TF = "app/src/main/java/app/aemu/core/TreeFixer.kt"
          VM = "app/src/main/java/app/aemu/ui/VmActivity.kt"
          RD = "app/src/main/java/app/aemu/ui/RootDialog.kt"

          TF_BLOCK = base64.b64decode("").decode("utf-8")
          ROOT_DIALOG = base64.b64decode("").decode("utf-8")

          TF_ANCHOR = '        if (copied > 0) log("engine n64 files updated: $copied")\n'
          VM_STATE_ANCHOR = '        var menu by remember { mutableStateOf(false) }\n'
          VM_STATE_NEW = VM_STATE_ANCHOR + '        var rootDialog by remember { mutableStateOf(false) }\n        if (rootDialog) RootAccessDialog(vm) { rootDialog = false }\n'
          VM_MENU_ANCHOR = '                    DropdownMenuItem(text = { Text(stringResource(R.string.m_terminal)) }, leadingIcon = { Icon(Icons.Rounded.Code, null) },\n                        enabled = running, onClick = { menu = false; showTerm = true })\n'
          VM_MENU_NEW = VM_MENU_ANCHOR + '                    DropdownMenuItem(text = { Text("Root access") }, leadingIcon = { Icon(Icons.Rounded.Security, null) },\n                        enabled = running, onClick = { menu = false; rootDialog = true })\n'

          def apply(path, anchor, new, tag):
              s = open(path, encoding="utf-8").read()
              if tag in s:
                  print("  already there:", tag)
                  return
              if anchor not in s:
                  print("  ANCHOR MISSING:", tag)
                  return
              s = s.replace(anchor, new, 1)
              open(path, "w", encoding="utf-8").write(s)
              print("  patched:", tag)

          if os.path.exists(RD):
              print("RootDialog.kt already exists")
          else:
              open(RD, "w", encoding="utf-8").write(ROOT_DIALOG)
              print("wrote RootDialog.kt")

          print("TreeFixer:")
          apply(TF, TF_ANCHOR, TF_BLOCK + TF_ANCHOR, "aemu-su")
          print("VmActivity:")
          apply(VM, VM_STATE_ANCHOR, VM_STATE_NEW, "var rootDialog")
          apply(VM, VM_MENU_ANCHOR, VM_MENU_NEW, 'Text("Root access")')

          PY

      - name: Commit
        run: |
          git config user.name "root-patch-bot"
          git config user.email "root-patch-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "add root access menu (su for selected apps)"
            git push
          fi
