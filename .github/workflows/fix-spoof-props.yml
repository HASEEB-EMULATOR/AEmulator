name: Fix spoof props
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite Spoof.kt
        run: |
          python3 - <<'PY'
          import base64
          CORE = "app/src/main/java/app/aemu/core/"
          open(CORE + "Spoof.kt", "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          print("rewrote Spoof.kt (identity only)")
          s = open(CORE + "Spoof.kt", encoding="utf-8").read()
          bad = [k for k in ["ro.hardware", "ro.kernel.qemu", "ro.boot.hardware", "ro.opengles.version"] if ('"' + k + '"') in s]
          print("hardware props left:", bad if bad else "none")

          PY

      - name: Commit
        run: |
          git config user.name "fix-bot"
          git config user.email "fix-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "device identity: identity props only, leave hardware alone"
            git push
          fi
