name: Add gaming mode
on: workflow_dispatch
permissions:
  contents: write
jobs:
  gaming:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply
        run: |
          python3 - <<'PY'
          import base64

          GAME = "app/src/main/java/app/aemu/core/Gaming.kt"
          GVM = "app/src/main/java/app/aemu/core/GuestVm.kt"
          VM = "app/src/main/java/app/aemu/ui/VmActivity.kt"

          open(GAME, "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          print("wrote Gaming.kt")
          MENU = base64.b64decode("").decode("utf-8")
          METHOD = base64.b64decode("").decode("utf-8")

          def patch(path, anchor, text, tag, after=False):
              s = open(path, encoding="utf-8").read()
              if tag in s:
                  print("  already:", tag); return
              if anchor not in s:
                  print("  ANCHOR MISSING in", path); return
              s = s.replace(anchor, (anchor + text) if after else (text + anchor), 1)
              open(path, "w", encoding="utf-8").write(s)
              print("  patched:", tag)

          # 1. GPU identity -> property overrides, before the area is prepared
          GVM_ANCHOR = '        if (!props.prepare(overrides, later, if (engine == Engine.N64) kernel.propAreaSize else PropArea.SIZE)) error("property area not ready")\n'
          GVM_NEW = ('        // gaming mode: report a Snapdragon GPU so games take their ES 3.x path\n'
                     '        if (Gaming.gpuEnabled(ctx)) runCatching { Gaming.gpuProps().forEach { (k, v) -> overrides[k] = v } }\n')
          patch(GVM, GVM_ANCHOR, GVM_NEW, "Gaming.gpuEnabled(ctx)")

          # 2. helper
          patch(VM, '    override fun onResume() {\n', METHOD, "private fun hideSystemBars")

          # 3. call it right after the content view is set
          patch(VM, '        setContentView(root)\n', '        hideSystemBars()\n', "\n        hideSystemBars()\n", after=True)

          # 4. menu entry after Root access
          VM_ROOT = ('                    DropdownMenuItem(text = { Text("Root access") }, leadingIcon = { Icon(Icons.Rounded.Tune, null) },\n'
                     '                        enabled = running, onClick = { menu = false; rootDialog = true })\n')
          patch(VM, VM_ROOT, MENU, 'Text("Gaming mode")', after=True)

          PY

      - name: Commit
        run: |
          git config user.name "gaming-bot"
          git config user.email "gaming-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "add gaming mode (preset + fullscreen + snapdragon gpu identity)"
            git push
          fi
