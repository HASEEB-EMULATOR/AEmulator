name: Fullscreen quality fix
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply
        run: |
          python3 - <<'PY'
          import base64

          CORE = "app/src/main/java/app/aemu/core/"
          UI = "app/src/main/java/app/aemu/ui/"
          VM = UI + "VmActivity.kt"
          ASA = UI + "AppSettingsActivity.kt"

          open(CORE + "Gaming.kt", "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          open(UI + "GamingDialog.kt", "w", encoding="utf-8").write(base64.b64decode("").decode("utf-8"))
          print("wrote Gaming.kt + GamingDialog.kt (quality + fps)")

          def sub(path, old, new, tag):
              s = open(path, encoding="utf-8").read()
              if tag in s:
                  print("  already:", tag); return
              if old not in s:
                  print("  OLD NOT FOUND in", path); return
              s = s.replace(old, new, 1)
              open(path, "w", encoding="utf-8").write(s)
              print("  patched:", tag)

          # 1. VmActivity: dialog now reports quality too
          OLD = "\n".join([
              '            onPick = { d, fps ->',
              '                gamingDialog = false',
              '                app.aemu.core.Gaming.apply(this@VmActivity, vm.img.id, d, fps)',
              '                hideSystemBars()',
              '                toast("Gaming mode: " + d.label + " @ " + fps + " fps - restart the system")',
              '            },',
          ])
          NEW = "\n".join([
              '            onPick = { d, fps, q ->',
              '                gamingDialog = false',
              '                app.aemu.core.Gaming.apply(this@VmActivity, vm.img.id, d, fps, q)',
              '                hideSystemBars()',
              '                toast("Gaming mode: " + d.label + " @ " + fps + " fps, " + q + "p - restart the system")',
              '            },',
          ])
          sub(VM, OLD, NEW, "d, fps, q ->")

          # 2. VmActivity: real fullscreen - no space reserved for the hidden bars
          OLD2 = "\n".join([
              '            val bars = ins.getInsets(androidx.core.view.WindowInsetsCompat.Type.systemBars() or androidx.core.view.WindowInsetsCompat.Type.displayCutout())',
              '            if (bars.top != safeTop || bars.bottom != safeBottom) { safeTop = bars.top; safeBottom = bars.bottom; v.requestLayout() }',
          ])
          NEW2 = "\n".join([
              '            val bars = ins.getInsets(androidx.core.view.WindowInsetsCompat.Type.systemBars() or androidx.core.view.WindowInsetsCompat.Type.displayCutout())',
              '            // fullscreen: the bars are hidden, so the guest fills the whole screen',
              '            val top = if (immersive) 0 else bars.top',
              '            val bottom = if (immersive) 0 else bars.bottom',
              '            if (top != safeTop || bottom != safeBottom) { safeTop = top; safeBottom = bottom; v.requestLayout() }',
          ])
          sub(VM, OLD2, NEW2, "if (immersive) 0 else bars.top")

          # 3. VmActivity: remember the mode and re-hide after dialogs
          OLD3 = "\n".join([
              '    private fun hideSystemBars() {',
              '        runCatching {',
          ])
          NEW3 = "\n".join([
              '    private var immersive = false',
              '',
              '    override fun onWindowFocusChanged(hasFocus: Boolean) {',
              '        super.onWindowFocusChanged(hasFocus)',
              '        if (hasFocus && immersive) hideSystemBars()',
              '    }',
              '',
              '    private fun hideSystemBars() {',
              '        immersive = true',
              '        runCatching {',
          ])
          sub(VM, OLD3, NEW3, "private var immersive = false")

          # 4. AppSettings: quality too
          OLD4 = "\n".join([
              '        onPick = { d, fps ->',
              '            gamingDialog = false',
              '            defaults = app.aemu.core.Gaming.applyDefaults(ctx, defaults, d, fps)',
              '            AppPrefs.setDefaults(ctx, defaults)',
              '        },',
          ])
          NEW4 = "\n".join([
              '        onPick = { d, fps, q ->',
              '            gamingDialog = false',
              '            defaults = app.aemu.core.Gaming.applyDefaults(ctx, defaults, d, fps, q)',
              '            AppPrefs.setDefaults(ctx, defaults)',
              '        },',
          ])
          sub(ASA, OLD4, NEW4, "applyDefaults(ctx, defaults, d, fps, q)")

          PY

      - name: Commit
        run: |
          git config user.name "fix-bot"
          git config user.email "fix-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m "fullscreen fills the screen, quality selector (360/540/720)"
            git push
          fi
