name: Root toggle
on: workflow_dispatch
permissions:
  contents: write
jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply
        run: |
          python3 - <<'PY'
          import base64, os

          RD = "app/src/main/java/app/aemu/ui/RootDialog.kt"
          TF = "app/src/main/java/app/aemu/core/TreeFixer.kt"

          ROOT_DIALOG = base64.b64decode("").decode("utf-8")
          NEW_BLOCK = base64.b64decode("").decode("utf-8")

          open(RD, "w", encoding="utf-8").write(ROOT_DIALOG)
          print("wrote RootDialog.kt (toggle)")

          s = open(TF, encoding="utf-8").read()
          start = s.find("        // root: the engine accepts setuid()")
          marker = '.onFailure { log("su: ${it.message}") }'
          end = s.find(marker, start)
          if start < 0 or end < 0:
              print("  TreeFixer: block not found, nothing changed")
          else:
              end = s.find("\n", end) + 1
              s = s[:start] + NEW_BLOCK + s[end:]
              open(TF, "w", encoding="utf-8").write(s)
              print("patched TreeFixer.kt (toggle wrapper)")

          PY

      - name: Commit
        run: |
          git config user.name "root-toggle-bot"
          git config user.email "root-toggle-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "root access: single on/off switch instead of per-app list"
            git push
          fi
